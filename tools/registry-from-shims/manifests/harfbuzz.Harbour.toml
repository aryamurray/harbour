[package]
name = "harfbuzz"
version = "15.0.0"
license = "MIT"

[dependencies]
freetype = { version = "^2.14", optional = true }

[features]
default = []

# HarfBuzz ships a single-translation-unit build: `harfbuzz.cc` includes every
# other source. The FreeType glue (`hb-ft.cc`) is part of it only when
# HAVE_FREETYPE is defined.
[targets.harfbuzz]
kind = "staticlib"
lang = "c++"
sources = ["src/harfbuzz.cc"]

[targets.harfbuzz.surface.compile.public]
include_dirs = ["src"]

[targets.harfbuzz.surface.compile.private]
defines = ["HB_NO_PRAGMA_GCC_DIAGNOSTIC_ERROR"]

[[targets.harfbuzz.surface.when]]
feature = "freetype"
[targets.harfbuzz.surface.when."compile.public"]
defines = ["HAVE_FREETYPE=1"]
