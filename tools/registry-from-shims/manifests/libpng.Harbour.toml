[package]
name = "libpng"
version = "1.6.50"
license = "Libpng"

[dependencies]
zlib = "^1.3"

[targets.png]
kind = "staticlib"
lang = "c"
sources = [
    "png.c", "pngerror.c", "pngget.c", "pngmem.c", "pngpread.c", "pngread.c",
    "pngrio.c", "pngrtran.c", "pngrutil.c", "pngset.c", "pngtrans.c",
    "pngwio.c", "pngwrite.c", "pngwtran.c", "pngwutil.c",
]

[targets.png.surface.compile.public]
include_dirs = ["."]
defines = ["PNG_ARM_NEON_OPT=0", "PNG_INTEL_SSE_OPT=0", "PNG_MIPS_MSA_OPT=0", "PNG_POWERPC_VSX_OPT=0", "PNG_LOONGARCH_LSX_OPT=0"]
