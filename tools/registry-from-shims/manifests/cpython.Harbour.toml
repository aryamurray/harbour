# Public, so the three programs over `core` inherit it. `os`/`arch` below are
# the platform of whoever is building: the target's for the interpreter, the
# host's inside a host tool.
[targets.core.deps]
pyconfig = { local = true }

[targets.core.surface.compile.public]
include_dirs = ["Include/internal", "Include/internal/mimalloc", ".", "Include", "generated"]
defines = ["Py_BUILD_CORE", "NDEBUG"]
# CPython relies on signed overflow wrapping; the Makefile always passes this.
cflags = ["-fno-strict-overflow"]

[[targets.core.surface.when]]
os = "macos"
[targets.core.surface.when."link.public"]
libs = ["dl"]
frameworks = ["CoreFoundation"]

[[targets.core.surface.when]]
os = "linux"
[targets.core.surface.when."link.public"]
libs = ["dl", "m"]

# The perf trampoline, which configure only enables on Linux.
[[targets.core.when]]
os = "linux"
sources = ["Python/asm_trampoline.S"]

# The zlib extension module, built into `core`: `config.c` lists it, so every
# program that links `core` -- the host tools included -- needs it, and with it
# the zlib dependency, which is then built for the host as well.
[[targets.core.when]]
feature = "zlib"
sources = ["Modules/zlibmodule.c"]

# The table of built-in extension modules. The feature set decides which
# modules it lists, so one step produces the right file for every combination
# -- see `HARBOUR_FEATURES`.
#
# Written to `generated/`, not `Modules/config.c` where CPython's own build puts
# it, so that no generated file sits inside a directory a generator below lists
# as an input.
[[targets.core.prebuild]]
program = "sh"
args = ["harbour/config.sh", "atexit", "faulthandler", "posix", "_signal", "_tracemalloc", "_suggestions", "_datetime", "_codecs", "_collections", "errno", "_io", "itertools", "_sre", "_sysconfig", "_thread", "time", "_types", "_typing", "_weakref", "_abc", "_functools", "_locale", "_opcode", "_operator", "_stat", "_symtable", "pwd"]
inputs = ["Modules/config.c.in", "harbour/config.sh"]
env = { CONFIG_OUT = "generated/config.c" }
outputs = ["generated/config.c"]

# --- pyconfig.h --------------------------------------------------------------
#
# CPython's `pyconfig.h` is what ./configure writes: 654 names. The measured
# ones (headers, functions, types, sizes) are asked of the toolchain by the probes
# below, on whichever platform builds -- nothing is vendored. The asserted ones
# (feature-test macros, choices, alignments, run-time behaviour checks) differ per
# platform and live in `harbour/pyconfig/<platform>.h`; a probes table cannot be
# scoped by `when`, so `harbour/pyconfig.sh` composes `generated/pyconfig.h` from
# that file and the probe-generated header. A platform with no literals file fails
# there and names the file it wanted, rather than building with another
# platform's answers. Everything below `[targets.pyconfig.probes]` is derived from
# ci/canary/cpython-config by tools/registry-from-shims/cpython/derive.py.

[targets.pyconfig]
kind = "staticlib"
lang = "c"
sources = ["harbour/empty.c"]

[[targets.pyconfig.when]]
os = "macos"
arch = "aarch64"
defines = [
    "_GNU_SOURCE=1",
    "_DARWIN_C_SOURCE=1",
    "_NETBSD_SOURCE=1",
    "__BSD_VISIBLE=1",
    "_REENTRANT=1",
    "_POSIX_PTHREAD_SEMANTICS=1",
    "_ALL_SOURCE=1",
    "_LARGEFILE_SOURCE=1",
    "_FILE_OFFSET_BITS=64",
    "_TANDEM_SOURCE=1",
    "__EXTENSIONS__=1",
]
[[targets.pyconfig.when.prebuild]]
program = "sh"
args = ["harbour/pyconfig.sh", "harbour/pyconfig/macos-aarch64.h"]
inputs = ["harbour/pyconfig.sh", "harbour/pyconfig/macos-aarch64.h"]
outputs = ["generated/pyconfig.h"]

[[targets.pyconfig.when]]
os = "linux"
arch = "aarch64"
defines = [
    "_GNU_SOURCE=1",
    "_DARWIN_C_SOURCE=1",
    "_NETBSD_SOURCE=1",
    "__BSD_VISIBLE=1",
    "_POSIX_C_SOURCE=200809L",
    "_XOPEN_SOURCE=700",
    "_XOPEN_SOURCE_EXTENDED=1",
    "_REENTRANT=1",
    "_POSIX_PTHREAD_SEMANTICS=1",
    "_ALL_SOURCE=1",
    "_LARGEFILE_SOURCE=1",
    "_FILE_OFFSET_BITS=64",
    "_TANDEM_SOURCE=1",
    "__EXTENSIONS__=1",
]
[[targets.pyconfig.when.prebuild]]
program = "sh"
args = ["harbour/pyconfig.sh", "harbour/pyconfig/linux-aarch64.h"]
inputs = ["harbour/pyconfig.sh", "harbour/pyconfig/linux-aarch64.h"]
outputs = ["generated/pyconfig.h"]

[[targets.pyconfig.when]]
os = "linux"
arch = "x86_64"
defines = [
    "_GNU_SOURCE=1",
    "_DARWIN_C_SOURCE=1",
    "_NETBSD_SOURCE=1",
    "__BSD_VISIBLE=1",
    "_POSIX_C_SOURCE=200809L",
    "_XOPEN_SOURCE=700",
    "_XOPEN_SOURCE_EXTENDED=1",
    "_REENTRANT=1",
    "_POSIX_PTHREAD_SEMANTICS=1",
    "_ALL_SOURCE=1",
    "_LARGEFILE_SOURCE=1",
    "_FILE_OFFSET_BITS=64",
    "_TANDEM_SOURCE=1",
    "__EXTENSIONS__=1",
]
[[targets.pyconfig.when.prebuild]]
program = "sh"
args = ["harbour/pyconfig.sh", "harbour/pyconfig/linux-x86_64.h"]
inputs = ["harbour/pyconfig.sh", "harbour/pyconfig/linux-x86_64.h"]
outputs = ["generated/pyconfig.h"]

[targets.pyconfig.probes]
emit = { header = "pyconfig_probed.h" }

