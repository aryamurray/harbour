# THE REGISTRY ENTRY'S MANIFEST, derived from ci/canary/cpython/Harbour.toml and
# ci/canary/cpython-config by tools/registry-from-shims/cpython/derive.py -- edit the
# derivation, not this file. Differences from the canary: zlib is a registry
# requirement, and `pyconfig.h` is generated (probes + a small per-platform
# literals header) instead of vendored three times.
#
# Harbour shim for CPython 3.14.9, copied into the extracted tree by
# `ci/canary/cpython/run.sh`; `overlay/` is laid over the tree beside it.
#
# What this canary is for: the deepest generated-source chain of any package
# here, built from **host targets**, and the first with an optional dependency
# whose feature changes a *generated* file.
#
#   * `core` is the interpreter minus its `main`, its frozen-module table and
#     `getpath`: one static library shared by three programs.
#   * `freeze_module` and `bootstrap_python` are `host = true` programs: built
#     for the machine running the build, on demand, because CPython freezes its
#     own startup modules by running CPython. `freeze_module` freezes four
#     modules; `bootstrap_python`, built from the same `core` plus those four,
#     freezes the other twenty. Each stage is a `prebuild` step that lists the
#     tool it needs under `tools`.
#   * The built-in module table (`config.c`) is generated from `config.c.in` and
#     the active features (`HARBOUR_FEATURES`), the way CPython's `makesetup`
#     does. Enabling `zlib` changes it.
#   * `inputs` lets every generator be skipped when nothing it reads changed.
#
# `core` is built twice on a native build -- once for the host tools, once for
# the interpreter -- because their artifacts live in different directories.
# Sharing them is phase 3 of docs/superpowers/specs/2026-10-24-host-tools-design.md.
#
# The host tools are configured for the HOST, which is what a plain `os`/`arch`
# condition means inside a host tool: CPython's tools run code, so they want the
# build machine's `pyconfig.h`, while the interpreter gets the target's.
#
# What is NOT generated here, said plainly: `pyconfig.h`. It has 412 answers
# and is what ./configure writes. A vendored copy per platform (produced by
# CPython's own ./configure, with the Makefile-derived values appended) stands
# in for the probe subsystem; probing it is a separate, curl-sized effort. A
# platform with no copy fails to compile and names the file it wanted, rather
# than building with another platform's answers.

[package]
name = "cpython"
version = "3.14.9"
license = "PSF-2.0"

[dependencies]
# A plain registry requirement: "from this registry". The registry also holds
# zlib, so a dependent that turns the `zlib` feature on gets a real, hash-checked
# zlib and nothing else is fetched.
zlib = { version = "^1.3", optional = true }

[features]
# Off by default. A dependent turns it on: `cpython = { version = "^3.14",
# features = ["zlib"] }`.
default = []

# --- the shared core ---------------------------------------------------------

[targets.core]
kind = "staticlib"
lang = "c"
# CPython's `configure` puts -std=c11 in the Makefile. It is not decoration: gcc
# 15 defaults to C23, where `Py_ARRAY_LENGTH` is not a constant expression and
