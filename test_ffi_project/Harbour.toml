[package]
name = "mylib"
version = "1.0.0"

[targets.mylib]
kind = "sharedlib"
sources = ["src/**/*.c"]
public_headers = ["include/**/*.h"]

# `header_files` is the only key `harbour ffi generate` reads from this
# table. `languages`, `bundler`, `output_dir` and `strip_prefix` used to be
# written here and were silently ignored; they are now rejected. The
# equivalent, which is what this fixture was always actually built with:
#
#   harbour ffi generate --lang typescript --bundler koffi \
#       --output bindings --strip-prefix mylib_
#
# tracking: https://github.com/aryamurray/harbour/issues/109
[targets.mylib.ffi]
header_files = ["include/**/*.h"]
