# Harbour shim for LuaJIT (commit pinned in run.sh), copied into the checked-out
# tree by `ci/canary/luajit/run.sh`; `overlay/harbour/gen.sh` is laid beside it.
#
# What this canary is for: a package that **compiles a program and runs it
# during the build**. LuaJIT's `buildvm` writes the VM's assembly (`lj_vm.S`)
# and seven tables; without it there is nothing to compile. It is the smallest
# real package with that shape, which is why it is here, and it is what
# `HARBOUR_HOST_CC` (the compiler for programs that run on the build machine,
# not for the target) exists for.
#
# What the shim cannot express, and says so rather than hiding it: LuaJIT's
# Makefile asks the *target compiler* what it predefines (`__CET__`,
# `__ARM_FEATURE_*`) and derives the DynASM flags from the answers. Those
# answers are written out per platform below as facts about the toolchains CI
# and a developer actually use. They are a candidate for Harbour's probe
# kinds, not something to guess for a platform with no block: LuaJIT then
# fails to find a generator and says so, rather than building the wrong VM.

[package]
name = "luajit"
version = "2.1.0"
license = "MIT"

[targets.luajit]
kind = "staticlib"
lang = "c"
sources = [
    "src/lj_assert.c",
    "src/lj_gc.c",
    "src/lj_err.c",
    "src/lj_char.c",
    "src/lj_bc.c",
    "src/lj_obj.c",
    "src/lj_buf.c",
    "src/lj_str.c",
    "src/lj_tab.c",
    "src/lj_func.c",
    "src/lj_udata.c",
    "src/lj_meta.c",
    "src/lj_debug.c",
    "src/lj_prng.c",
    "src/lj_state.c",
    "src/lj_dispatch.c",
    "src/lj_vmevent.c",
    "src/lj_vmmath.c",
    "src/lj_strscan.c",
    "src/lj_strfmt.c",
    "src/lj_strfmt_num.c",
    "src/lj_serialize.c",
    "src/lj_api.c",
    "src/lj_profile.c",
    "src/lj_lex.c",
    "src/lj_parse.c",
    "src/lj_bcread.c",
    "src/lj_bcwrite.c",
    "src/lj_load.c",
    "src/lj_ir.c",
    "src/lj_opt_mem.c",
    "src/lj_opt_fold.c",
    "src/lj_opt_narrow.c",
    "src/lj_opt_dce.c",
    "src/lj_opt_loop.c",
    "src/lj_opt_split.c",
    "src/lj_opt_sink.c",
    "src/lj_mcode.c",
    "src/lj_snap.c",
    "src/lj_record.c",
    "src/lj_crecord.c",
    "src/lj_ffrecord.c",
    "src/lj_asm.c",
    "src/lj_trace.c",
    "src/lj_gdbjit.c",
    "src/lj_ctype.c",
    "src/lj_cdata.c",
    "src/lj_cconv.c",
    "src/lj_ccall.c",
    "src/lj_ccallback.c",
    "src/lj_carith.c",
    "src/lj_clib.c",
    "src/lj_cparse.c",
    "src/lj_lib.c",
    "src/lj_alloc.c",
    "src/lib_aux.c",
    "src/lib_base.c",
    "src/lib_math.c",
    "src/lib_bit.c",
    "src/lib_string.c",
    "src/lib_table.c",
    "src/lib_io.c",
    "src/lib_os.c",
    "src/lib_package.c",
    "src/lib_debug.c",
    "src/lib_jit.c",
    "src/lib_ffi.c",
    "src/lib_buffer.c",
    "src/lib_init.c",
    "src/lj_vm.S",
]

[targets.luajit.surface.compile.public]
include_dirs = ["src"]

# upstream's Makefile sets this unconditionally on Darwin, for both
# architectures, and on Linux whenever the compiler emits unwind tables --
# which gcc and clang always do on x86_64 and aarch64. On x86_64 `lj_err.c`
# refuses to compile without it.
[[targets.luajit.surface.when]]
os = "macos"
[targets.luajit.surface.when."compile.private"]
defines = ["LUAJIT_UNWIND_EXTERNAL"]

# The rest are what the Makefile adds on Linux. `-fno-stack-protector` and
# `-U_FORTIFY_SOURCE` matter: the VM's hand-written assembly assumes the
# frame layout the C code has without them.
[[targets.luajit.surface.when]]
os = "linux"
[targets.luajit.surface.when."compile.private"]
defines = ["LUAJIT_UNWIND_EXTERNAL", "_FILE_OFFSET_BITS=64", "_LARGEFILE_SOURCE"]
cflags = ["-fno-stack-protector", "-U_FORTIFY_SOURCE"]
[targets.luajit.surface.when."link.public"]
libs = ["m", "dl"]

# Linux x86_64 also enables the CET shadow stack in the VM. It must agree
# between the DynASM output (`-D SHADOW_STACK`) and the C that includes it
# (`LJ_ABI_SHADOW_STACK`): upstream's Makefile passes both when the target
# compiler defines `__CET__ & 2`, as Ubuntu's gcc does by default. Public, not
# private, because `lj_arch.h` reads it and Harbour (rightly) refuses to leave
# a define that a header reads off the consumers' command lines; LuaJIT's
# consumer-facing headers do not depend on it, so it costs them nothing.
[[targets.luajit.surface.when]]
os = "linux"
arch = "x86_64"
[targets.luajit.surface.when."compile.public"]
defines = ["LJ_ABI_SHADOW_STACK=1"]

[[targets.luajit.when]]
os = "macos"
arch = "aarch64"
[[targets.luajit.when.prebuild]]
program = "sh"
args = ["harbour/gen.sh", "arm64", "vm_arm64.dasc", "machasm", "-D ENDIAN_LE -D P64 -D JIT -D FFI -D DUALNUM -D FPU -D HFABI -D VER=80"]
env = { LUAJIT_RELVER = "1792588164" }
outputs = ["src/lj_vm.S", "src/lj_bcdef.h", "src/lj_ffdef.h", "src/lj_libdef.h", "src/lj_recdef.h", "src/lj_folddef.h", "src/jit/vmdef.lua", "src/luajit_relver.txt", "src/luajit.h"]

[[targets.luajit.when]]
os = "macos"
arch = "x86_64"
[[targets.luajit.when.prebuild]]
program = "sh"
args = ["harbour/gen.sh", "x64", "vm_x64.dasc", "machasm", "-D ENDIAN_LE -D P64 -D JIT -D FFI -D FPU -D HFABI -D VER="]
env = { LUAJIT_RELVER = "1792588164" }
outputs = ["src/lj_vm.S", "src/lj_bcdef.h", "src/lj_ffdef.h", "src/lj_libdef.h", "src/lj_recdef.h", "src/lj_folddef.h", "src/jit/vmdef.lua", "src/luajit_relver.txt", "src/luajit.h"]

[[targets.luajit.when]]
os = "linux"
arch = "aarch64"
[[targets.luajit.when.prebuild]]
program = "sh"
args = ["harbour/gen.sh", "arm64", "vm_arm64.dasc", "elfasm", "-D ENDIAN_LE -D P64 -D JIT -D FFI -D DUALNUM -D FPU -D HFABI -D VER=80"]
env = { LUAJIT_RELVER = "1792588164" }
outputs = ["src/lj_vm.S", "src/lj_bcdef.h", "src/lj_ffdef.h", "src/lj_libdef.h", "src/lj_recdef.h", "src/lj_folddef.h", "src/jit/vmdef.lua", "src/luajit_relver.txt", "src/luajit.h"]

[[targets.luajit.when]]
os = "linux"
arch = "x86_64"
[[targets.luajit.when.prebuild]]
program = "sh"
args = ["harbour/gen.sh", "x64", "vm_x64.dasc", "elfasm", "-D ENDIAN_LE -D P64 -D JIT -D FFI -D FPU -D HFABI -D SHADOW_STACK -D VER=", "-DLJ_ABI_SHADOW_STACK=1"]
env = { LUAJIT_RELVER = "1792588164" }
outputs = ["src/lj_vm.S", "src/lj_bcdef.h", "src/lj_ffdef.h", "src/lj_libdef.h", "src/lj_recdef.h", "src/lj_folddef.h", "src/jit/vmdef.lua", "src/luajit_relver.txt", "src/luajit.h"]
