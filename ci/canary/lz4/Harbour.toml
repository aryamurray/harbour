# lz4 1.9.4, shimmed for Harbour.
#
# Redpanda needs lz4 twice: Seastar's RPC layer compresses frames with it
# (`src/rpc/lz4_compressor.cc`), and Redpanda's Kafka-compatible produce path
# reads and writes lz4-framed batches. Both pin 1.9.4 (MODULE.bazel). The
# Bazel Central Registry builds the same four files this shim lists.
#
# Four C sources in one directory, no generated header and nothing
# conditional: the leaf that proves a Redpanda dependency builds, with nothing
# else in the way. `lz4file.c` is deliberately absent -- it is not in upstream's
# own cmake source list either, and it needs `lz4frame_static.h` symbols a
# static consumer does not want.

[package]
name = "lz4"
version = "1.9.4"
description = "Extremely fast compression"
license = "BSD-2-Clause"
homepage = "https://lz4.org/"
requires = "hosted"
supports = ["*-apple-darwin", "*-*-linux-gnu", "*-*-linux-musl"]

[targets.lz4]
kind = "staticlib"
sources = [
  "lib/lz4.c",
  "lib/lz4hc.c",
  "lib/lz4frame.c",
  "lib/xxhash.c",
]
public_headers = ["lib/lz4.h", "lib/lz4hc.h", "lib/lz4frame.h"]

[targets.lz4.public]
include_dirs = ["lib"]
