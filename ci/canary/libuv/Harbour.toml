# libuv 1.51.0, shimmed for Harbour.
#
# The platform-selection stress test from the 2026-09-07 extensibility audit.
# libuv's source split is by **OS**, not by architecture: the same four files
# build on every Linux arch. Keying this on os+arch -- which is what a
# per-harvested-platform scheme naturally produces -- would leave
# linux/riscv64 matching no block and failing to link, despite libuv
# supporting it.
#
# Sources and defines came from `tools/harvest`, reading a real cmake
# configure on macos/aarch64, linux/x86_64 and linux/aarch64. The
# unconditional list is the intersection: the files every unix platform
# compiles. Unlike openssl there is no portable fallback to harvest -- libuv
# has no generic event loop -- so a platform with no `when` block below fails
# to link on `uv__platform_loop_init` rather than building something subtly
# wrong. That is the right failure.
#
# `NDEBUG` appeared in all three harvests and is deliberately absent: it is
# the cmake `Release` build type leaking in, and Harbour profiles own that.

[package]
name = "libuv"
version = "1.51.0"
description = "Cross-platform asynchronous I/O"
license = "MIT"
homepage = "https://libuv.org"
requires = "hosted"
supports = ["*-apple-darwin", "*-*-linux-gnu", "*-*-linux-musl", "*-pc-windows-msvc"]

[targets.uv]
kind = "staticlib"
sources = [
  "src/fs-poll.c",
  "src/idna.c",
  "src/inet.c",
  "src/random.c",
  "src/strscpy.c",
  "src/strtok.c",
  "src/thread-common.c",
  "src/threadpool.c",
  "src/timer.c",
  "src/unix/async.c",
  "src/unix/core.c",
  "src/unix/dl.c",
  "src/unix/fs.c",
  "src/unix/getaddrinfo.c",
  "src/unix/getnameinfo.c",
  "src/unix/loop-watcher.c",
  "src/unix/loop.c",
  "src/unix/pipe.c",
  "src/unix/poll.c",
  "src/unix/process.c",
  "src/unix/proctitle.c",
  "src/unix/random-devurandom.c",
  "src/unix/signal.c",
  "src/unix/stream.c",
  "src/unix/tcp.c",
  "src/unix/thread.c",
  "src/unix/tty.c",
  "src/unix/udp.c",
  "src/uv-common.c",
  "src/uv-data-getter-setters.c",
  "src/version.c",
]
public_headers = ["include/uv.h", "include/uv/*.h"]

[targets.uv.public]
include_dirs = ["include"]
system_libs = ["pthread"]

[targets.uv.private]
include_dirs = ["include", "src"]
defines = ["_FILE_OFFSET_BITS=64", "_LARGEFILE_SOURCE"]

[[targets.uv.when]]
os = "linux"
sources = [
  "src/unix/linux.c",
  "src/unix/procfs-exepath.c",
  "src/unix/random-getrandom.c",
  "src/unix/random-sysctl-linux.c",
]
defines = ["_GNU_SOURCE", "_POSIX_C_SOURCE=200112"]

[[targets.uv.when]]
os = "macos"
sources = [
  "src/unix/bsd-ifaddrs.c",
  "src/unix/darwin-proctitle.c",
  "src/unix/darwin.c",
  "src/unix/fsevents.c",
  "src/unix/kqueue.c",
  "src/unix/random-getentropy.c",
]
defines = ["_DARWIN_UNLIMITED_SELECT=1", "_DARWIN_USE_64_BIT_INODE=1"]

[[targets.uv.surface.when]]
os = "linux"
[targets.uv.surface.when."link.public"]
libs = ["dl", "rt"]

# Windows is the third source set, and the one that shares least. libuv has no
# portable event loop, so the unconditional list's `src/unix/*.c` (19 files that
# need `<sys/socket.h>`) is taken back out and replaced by `src/win/` -- 25 files,
# one per handle type, on top of the 12 portable files at the top level. 37 in all,
# the same count macOS compiles and two more than Linux, by coincidence.
#
# `WIN32_LEAN_AND_MEAN` keeps `<windows.h>` from pulling in winsock 1, which
# conflicts with the winsock 2 libuv includes; `_WIN32_WINNT=0x0A00` selects the
# Windows 10 API set; `_CRT_DECLARE_NONSTDC_NAMES=0` stops the CRT from declaring
# POSIX-named functions (`read`, `close`) libuv defines itself. The two defines
# at the top of the file (`_FILE_OFFSET_BITS`, `_LARGEFILE_SOURCE`) are unix-only
# and inert here, and a define cannot be removed for one platform.
[[targets.uv.when]]
os = "windows"
exclude = ["src/unix/*.c"]
sources = [
  "src/win/async.c",
  "src/win/core.c",
  "src/win/detect-wakeup.c",
  "src/win/dl.c",
  "src/win/error.c",
  "src/win/fs.c",
  "src/win/fs-event.c",
  "src/win/getaddrinfo.c",
  "src/win/getnameinfo.c",
  "src/win/handle.c",
  "src/win/loop-watcher.c",
  "src/win/pipe.c",
  "src/win/thread.c",
  "src/win/poll.c",
  "src/win/process.c",
  "src/win/process-stdio.c",
  "src/win/signal.c",
  "src/win/snprintf.c",
  "src/win/stream.c",
  "src/win/tcp.c",
  "src/win/tty.c",
  "src/win/udp.c",
  "src/win/util.c",
  "src/win/winapi.c",
  "src/win/winsock.c",
]
defines = ["WIN32_LEAN_AND_MEAN", "_WIN32_WINNT=0x0A00", "_CRT_DECLARE_NONSTDC_NAMES=0"]

[[targets.uv.surface.when]]
os = "windows"
[targets.uv.surface.when."link.public"]
libs = ["psapi", "user32", "advapi32", "iphlpapi", "userenv", "ws2_32", "dbghelp", "ole32", "shell32"]
