# GENERATED by generate.py from CPython 3.14.9's own `configure` (what is
# asked) and its `pyconfig.h` on macos-aarch64 (the answers). Edit the
# generator, not this file; see regenerate.md.

[package]
name = "cpython-config"
version = "3.14.9"
description = "CPython 3.14.9's configure questions, answered by Harbour probes"
requires = "hosted"

[targets.cpython-config]
kind = "exe"
sources = ["src/main.c"]

# configure runs every check after pyconfig.h's feature-test macros are in
# scope, so the probes must be asked under them: glibc declares `memrchr`
# only with `_GNU_SOURCE`. They are also in the header, below.
[[targets.cpython-config.when]]
os = "macos"
arch = "aarch64"
defines = [
    "_GNU_SOURCE=1",
    "_DARWIN_C_SOURCE=1",
    "_NETBSD_SOURCE=1",
    "__BSD_VISIBLE=1",
    "_REENTRANT=1",
    "_POSIX_PTHREAD_SEMANTICS=1",
    "_ALL_SOURCE=1",
    "_LARGEFILE_SOURCE=1",
    "_FILE_OFFSET_BITS=64",
    "_TANDEM_SOURCE=1",
    "__EXTENSIONS__=1",
]

[targets.cpython-config.probes]
emit = { header = "pyconfig.h" }

