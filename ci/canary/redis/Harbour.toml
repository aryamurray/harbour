  "src/sort.c",
  "src/intset.c",
  "src/syncio.c",
  "src/cluster.c",
  "src/endianconv.c",
  "src/slowlog.c",
  "src/eval.c",
  "src/bio.c",
  "src/rio.c",
  "src/rand.c",
  "src/memtest.c",
  "src/syscheck.c",
  "src/bitops.c",
  "src/sentinel.c",
  "src/notify.c",
  "src/setproctitle.c",
  "src/blocked.c",
  "src/hyperloglog.c",
  "src/latency.c",
  "src/sparkline.c",
  "src/redis-check-rdb.c",
  "src/redis-check-aof.c",
  "src/geo.c",
  "src/lazyfree.c",
  "src/module.c",
  "src/evict.c",
  "src/expire.c",
  "src/geohash.c",
  "src/geohash_helper.c",
  "src/childinfo.c",
  "src/defrag.c",
  "src/rax.c",
  "src/t_stream.c",
  "src/listpack.c",
  "src/localtime.c",
  "src/lolwut.c",
  "src/lolwut5.c",
  "src/lolwut6.c",
  "src/acl.c",
  "src/tracking.c",
  "src/socket.c",
  "src/tls.c",
  "src/sha256.c",
  "src/timeout.c",
  "src/setcpuaffinity.c",
  "src/resp_parser.c",
  "src/call_reply.c",
  "src/script_lua.c",
  "src/script.c",
