[targets.redis-server.private]
include_dirs = ["deps/hiredis", "deps/linenoise", "deps/lua/src", "deps/hdr_histogram", "deps/fpconv"]
[targets.redis-server.deps]
common = { local = true }
hiredis = { local = true }
lua = { local = true }
hdr_histogram = { local = true }
fpconv = { local = true }

[targets.redis-cli]
kind = "exe"
c_std = "gnu11"
sources = [
  "src/redis-cli.c",
  "src/redisassert.c",
  "src/cli_common.c",
  "src/cli_commands.c",
]
[targets.redis-cli.private]
