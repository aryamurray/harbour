hiredis = { local = true }
linenoise = { local = true }

[targets.redis-benchmark]
kind = "exe"
c_std = "gnu11"
sources = [
  "src/redis-benchmark.c",
  "src/redisassert.c",
  "src/cli_common.c",
]
[targets.redis-benchmark.private]
include_dirs = ["deps/hiredis", "deps/linenoise", "deps/lua/src", "deps/hdr_histogram", "deps/fpconv"]
[targets.redis-benchmark.deps]
common = { local = true }
hiredis = { local = true }
hdr_histogram = { local = true }

# What the Makefile's `uname` switches add to `FINAL_LIBS` and `FINAL_LDFLAGS`
# for the two supported kernels. macOS needs nothing beyond `-lm -ldl`. Linux
# also needs `-lpthread -lrt`, and `-rdynamic` so `backtrace_symbols` can name
# the server's own functions in a crash report.
[[targets.common.surface.when]]
os = "linux"
[targets.common.surface.when."link.public"]
libs = ["pthread", "rt"]

[[targets.redis-server.surface.when]]
os = "linux"
[targets.redis-server.surface.when."link.private"]
ldflags = ["-rdynamic"]

# `-funwind-tables` is how Redis gets stack traces on ARM when it crashes.
[[targets.common.when]]
arch = "aarch64"
cflags = ["-funwind-tables"]
[[targets.redis-server.when]]
arch = "aarch64"
cflags = ["-funwind-tables"]
