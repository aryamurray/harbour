[package]
name = "cjson-canary"
version = "0.1.0"

[dependencies]
# `../upstream` is where `lib.sh` extracts the pinned tarball and drops the
# committed shim.
cjson = { path = "../upstream" }

[targets.cjson-canary]
kind = "exe"
sources = ["src/main.c"]

[targets.cjson-canary.deps]
cjson = "cjson"
