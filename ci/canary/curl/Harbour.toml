[targets.curl.private]
# `lib` for curl's internal headers, `include` for its public ones. The
# directory holding the generated `curl_config.h` is added by Harbour, at the
# front of this list.
include_dirs = ["lib", "include"]
# `HAVE_CONFIG_H` is what makes `lib/curl_setup.h:138` include
# `curl_config.h` instead of falling back to one of curl's hand-written
# `config-win32.h` / `config-mac.h`. It is the single define that decides
# whether this whole subsystem is in the build or not.
defines = ["HAVE_CONFIG_H", "BUILDING_LIBCURL"]

[targets.curl.public]
include_dirs = ["include"]
# Public because `curl/curl.h` reads it: without it the header decorates
# every entry point with `__declspec(dllimport)` on Windows, and a consumer
# that disagreed with the library about that would fail to link. One fact,
# one place, on the surface that carries it to consumers.
defines = ["CURL_STATICLIB"]

[targets.curl.surface.link.public]
# curl's threaded resolver and `curl_threads.c` need pthreads.
libs = ["pthread"]

# `lib/macos.c` reads the system proxy configuration through
# SystemConfiguration, so `Curl_macos_init` leaves `SCDynamicStoreCopyProxies`
# and `CFRelease` undefined without these. Found by the link failing, which
# is the right way to find it: nothing in the config header mentions them, so
# no probe could have.
[[targets.curl.surface.when]]
os = "macos"
[targets.curl.surface.when."link.public"]
frameworks = ["CoreFoundation", "SystemConfiguration"]

# ---------------------------------------------------------------------------
# The probes: 108 questions, answered by the toolchain.
#
# 106 of them are the questions `ci/canary/curl-config/` checks against curl's
# own cmake, question by question, on macOS and Linux. The other two are
# `SIZEOF_CURL_OFF_T` and `SIZEOF_CURL_SOCKET_T`, which are asked about curl's
# own typedefs and so only make sense here.
# ---------------------------------------------------------------------------
[targets.curl.probes]
emit = { header = "curl_config.h" }

# The project options, and the four assertions that hold on both platforms.
#
# curl has 93 project options and every one that is *off* is already spelled
# `/* #undef */` by curl's own header, so only the ones that are on need
# saying. They are in a separate list from the probes precisely so that the
# generated header's `/* #undef */` lines keep meaning "asked and answered
# no" rather than "nobody mentioned it".
#
# Only the ones that are *on* need saying. A `CURL_DISABLE_*` that is off is
# the default, and curl's own header spells it `/* #undef */`.
defines = [
  # Matching the oracle's cmake options.
  "CURL_DISABLE_LDAP=1",
  "CURL_DISABLE_LDAPS=1",
  # HSTS and HTTP message signatures both need a crypto backend, and there is
  # none in this configuration. curl's cmake reaches the same conclusion.
  "CURL_DISABLE_HSTS=1",
  "CURL_DISABLE_HTTPSIG=1",
  # Features that are on, and that curl's code tests by name rather than by
  # absence.
  "USE_IPV6=1",
  "USE_UNIX_SOCKETS=1",
  "USE_RESOLV_THREADED=1",
  "HAVE_THREADS_POSIX=1",
  # `off_t` is 64-bit because `_FILE_OFFSET_BITS` says so, and curl's
  # `SIZEOF_OFF_T` probe below is measured *with* that define in scope.
  "_FILE_OFFSET_BITS=64",
  # The name curl puts in its user agent and in `curl_version()`. A string,
  # so it is a packager's choice by construction.
  "CURL_OS=\"harbour\"",

  # --- Not choices: assertions. -------------------------------------------
  # These four are answers no probe kind can give, and they are the same on
  # both platforms this canary supports, so they need no `[[when]]` block.
  # They are grouped and labelled rather than scattered, because the one
  # thing a generated config header must never do is make an assertion look
  # like a measurement.
  #
  # Each is a `check_c_source_compiles` in curl's cmake over a program with
  # no declarative shape -- the category the probe design rejects by name.
  "HAVE_ATOMIC=1",
  "HAVE_DECL_FSEEKO=1",
  "HAVE_GETADDRINFO_THREADSAFE=1",
  # And this one is a *run* probe: curl's test writes to `argv[0]` and sees
  # whether it took. Permanently out of scope by the design's organising
  # principle, and curl's own cmake hardcodes it per platform too, which is
  # the same admission made in a different file.
  "HAVE_WRITABLE_ARGV=1",
]

# Header existence: 35 questions, the same list `ci/canary/curl-config/`
# checks against curl's own answers.
check_headers = [
  "arpa/inet.h",
  "dirent.h",
  "fcntl.h",
  "ifaddrs.h",
  "libgen.h",
  "linux/tcp.h",
  "locale.h",
  "net/if.h",
  "netdb.h",
  "netinet/in.h",
  "netinet/in6.h",
  "netinet/ip.h",
  "netinet/tcp.h",
  "netinet/udp.h",
  "poll.h",
  "pwd.h",
  "stdatomic.h",
  "stdbool.h",
  "strings.h",
  "stropts.h",
  "sys/eventfd.h",
  "sys/filio.h",
  "sys/ioctl.h",
  "sys/param.h",
  "sys/poll.h",
  "sys/resource.h",
  "sys/select.h",
  "sys/sockio.h",
  "sys/types.h",
  "sys/un.h",
  "sys/utime.h",
  "termio.h",
  "termios.h",
  "unistd.h",
  "utime.h",
]

# Function existence: 54 questions. Each *links*, which is the point -- a
# header that declares something the libc does not provide answers `yes` to
# a compile-only check and then fails at link time in a file nobody wrote.
check_symbols = [
  "accept4",
  "alarm",
  "arc4random",
  "basename",
  "closesocket",
  "eventfd",
  "fcntl",
  "fnmatch",
  "freeaddrinfo",
  "fseeko",
  "fsetxattr",
  "getaddrinfo",
  "geteuid",
  "gethostbyname_r",
  "gethostname",
  "getifaddrs",
  "getpass_r",
  "getpeername",
  "getppid",
  "getpwuid",
  "getpwuid_r",
  "getrlimit",
  "getsockname",
  "gettimeofday",
  "gmtime_r",
  "if_nametoindex",
  "ioctlsocket",
  "localtime_r",
  "mach_absolute_time",
  "memrchr",
  "memset_explicit",
  "memset_s",
  "opendir",
  "pipe",
  "pipe2",
  "poll",
  "realpath",
  "recv",
  "sched_yield",
  "send",
  "sendmmsg",
  "sendmsg",
  "setlocale",
  "setrlimit",
  "sigaction",
  "siginterrupt",
  "signal",
  "socket",
  "socketpair",
  "strcasecmp",
  "strerror_r",
  "utime",
  "utimes",
]

# `sigsetjmp` is a macro over `__sigsetjmp` on glibc and a real function on
# macOS, so it needs its header named. The bulk list deliberately supplies no
# prelude: it is for functions reachable with no header, and a symbol that is
# a macro anywhere is not one of those.
[targets.curl.probes.named.HAVE_SIGSETJMP]
symbol = "sigsetjmp"
prelude = ["setjmp.h"]

# ---------------------------------------------------------------------------
# Type existence: 6 questions. curl's code does not compile without these.
# Each prelude is the set of headers curl's own test includes.
# ---------------------------------------------------------------------------

[targets.curl.probes.named.HAVE_BOOL_T]
type = "bool"
prelude = ["sys/types.h", "stdbool.h"]

[targets.curl.probes.named.HAVE_SA_FAMILY_T]
type = "sa_family_t"
prelude = ["sys/socket.h"]

[targets.curl.probes.named.HAVE_SUSECONDS_T]
type = "suseconds_t"
prelude = ["sys/types.h", "sys/time.h"]

[targets.curl.probes.named.HAVE_STRUCT_TIMEVAL]
type = "struct timeval"
prelude = ["sys/time.h", "time.h"]

[targets.curl.probes.named.HAVE_STRUCT_SOCKADDR_STORAGE]
type = "struct sockaddr_storage"
prelude = ["sys/socket.h"]

[targets.curl.probes.named.HAVE_SOCKADDR_IN6_SIN6_SCOPE_ID]
type = "struct sockaddr_in6"
member = "sin6_scope_id"
prelude = ["netinet/in.h"]

# ---------------------------------------------------------------------------
# Constant existence: 6 questions about `ioctl`/`fcntl`/`setsockopt`/
# `clock_gettime` flags.
# ---------------------------------------------------------------------------

[targets.curl.probes.named.HAVE_FCNTL_O_NONBLOCK]
constant = "O_NONBLOCK"
prelude = ["sys/types.h", "unistd.h", "fcntl.h"]

[targets.curl.probes.named.HAVE_IOCTL_FIONBIO]
constant = "FIONBIO"
prelude = ["sys/types.h", "unistd.h", "sys/socket.h", "sys/ioctl.h"]

[targets.curl.probes.named.HAVE_IOCTL_SIOCGIFADDR]
constant = "SIOCGIFADDR"
prelude = ["sys/types.h", "unistd.h", "sys/socket.h", "sys/ioctl.h", "net/if.h"]

[targets.curl.probes.named.HAVE_SETSOCKOPT_SO_NONBLOCK]
constant = "SO_NONBLOCK"
prelude = ["sys/types.h", "sys/socket.h"]

[targets.curl.probes.named.HAVE_CLOCK_GETTIME_MONOTONIC]
constant = "CLOCK_MONOTONIC"
prelude = ["time.h"]

[targets.curl.probes.named.HAVE_CLOCK_GETTIME_MONOTONIC_RAW]
constant = "CLOCK_MONOTONIC_RAW"
prelude = ["time.h"]

# ---------------------------------------------------------------------------
# Sizes: 7 questions. Two of them are asked about *curl's own* typedefs,
# which works because a probe is compiled with the target's resolved
# `include_dirs` -- `include/` is on that list, so `curl/curl.h` is reachable
# from a probe snippet. curl's cmake computes these two by sizing whichever
# type it picked for `curl_off_t`; measuring the typedef directly asks the
# same question of the same headers without restating the choice.
# ---------------------------------------------------------------------------

[targets.curl.probes.named.SIZEOF_INT]
sizeof = "int"

[targets.curl.probes.named.SIZEOF_LONG]
sizeof = "long"

[targets.curl.probes.named.SIZEOF_OFF_T]
sizeof = "off_t"
prelude = ["sys/types.h"]

[targets.curl.probes.named.SIZEOF_SIZE_T]
sizeof = "size_t"
prelude = ["stddef.h"]

[targets.curl.probes.named.SIZEOF_TIME_T]
sizeof = "time_t"
prelude = ["time.h"]

[targets.curl.probes.named.SIZEOF_CURL_OFF_T]
sizeof = "curl_off_t"
prelude = ["curl/curl.h"]

[targets.curl.probes.named.SIZEOF_CURL_SOCKET_T]
sizeof = "curl_socket_t"
prelude = ["curl/curl.h"]

# ---------------------------------------------------------------------------
# The answers that are *not* measurements, keyed on the platform they hold
# for.
#
# This is the design's prescribed escape hatch and it is deliberately plain:
# every line below is a human asserting a fact, in the manifest, where a
# reviewer can see that it *is* an assertion. The alternative considered and
# rejected was a probe kind for function arity -- "compile this call with
# this many arguments" -- which is an arbitrary C snippet with a fig leaf,
# and which would make these five look exactly like the 108 measured ones.
#
# Each value is what curl's own cmake concludes on that platform, and all
# five differ between the two, which is what makes them worth keeping
# visible rather than folding into the invariant group above.
# ---------------------------------------------------------------------------

[[targets.curl.when]]
os = "macos"
defines = [
  # `fsetxattr` takes six arguments on Darwin and five on Linux. The
  # `symbol` probe answers that the name links, which it does on both.
  "HAVE_FSETXATTR_6=1",
  # Darwin's `strerror_r` is the POSIX one (returns `int`); glibc's default
  # is the GNU one (returns `char *`).
  "HAVE_POSIX_STRERROR_R=1",
  # `__builtin_available` is a clang/Darwin extension.
  "HAVE_BUILTIN_AVAILABLE=1",
]

[[targets.curl.when]]
os = "linux"
defines = [
  # `_GNU_SOURCE` is not an assertion; it is a *feature-test macro*, and it
  # belongs in this block because curl's own cmake puts it in exactly the
  # same place -- `CMakeLists.txt:255-258`, on Linux, Cygwin and GNU only,
  # with the comment "Required for accept4(), pipe2(), sendmmsg()" and a
  # second line adding it to `CMAKE_REQUIRED_DEFINITIONS` so that every
  # feature check sees it too.
  #
  # Leaving it out is the one thing this shim got wrong, and it is worth
  # recording how it was found because it is the failure shape this repo
  # keeps producing. Without it:
  #
  #   - glibc declares `memrchr` and `accept4` only under `_GNU_SOURCE`, so
  #     GCC compiled four call sites with `implicit declaration of function
  #     'memrchr'` -- which in C means "returns int". The 32 low bits of a
  #     pointer were then assigned to a `const char *`, and
  #     `urlapi.c`'s `dedotdotify` resolved relative URLs wrongly.
  #   - glibc's default `strerror_r` is the XSI one, which returns `int`.
  #     `HAVE_GLIBC_STRERROR_R` below asserts it is the GNU one, which
  #     returns `char *`. Under `_GNU_SOURCE` that assertion is true; without
  #     it, `curlx/strerr.c:293` assigns an `int` to a `const char *`.
  #
  # The library built, linked and passed every check on macOS. It was the
  # consumer's relative-URL assertion, on Linux, that failed -- a successful
  # build with wrong output, which is what the consumer exists for. A canary
  # that stopped at "curl compiled" would have shipped this.
  #
  # Probes see it too: a target-level `[[when]]` block's `defines` reach the
  # probe command line, verified on a recorded argv. That matters, because
  # `_GNU_SOURCE` changes which declarations exist and a probe answered
  # without it would be answering about a different translation unit than
  # the one being compiled.
  "_GNU_SOURCE=1",

  "HAVE_FSETXATTR_5=1",
  "HAVE_GLIBC_STRERROR_R=1",
  # glibc's `gethostbyname_r` is the six-argument form. The `symbol` probe
  # answers that the name links -- which it does on glibc and not on Darwin
  # -- and says nothing about the arity.
  "HAVE_GETHOSTBYNAME_R_6=1",
]
