# Harbour shim for curl 8.22.0, copied into the extracted upstream tree by
# `ci/canary/curl/run.sh`.
#
# This is what the probe subsystem was built for. There is **no vendored
# `curl_config.h`** here: every `HAVE_*` and `SIZEOF_*` curl's code reads is
# measured from the toolchain by a probe, and written into a generated
# header. The file this replaces was 793 lines per (os, arch) pair, and the
# CI job that produced it (`.github/workflows/harvest.yml:76-86`) said in its
# own comment that the config header "is the part that genuinely cannot be
# produced on another platform".
#
# Read `ci/canary/curl-config/regenerate.md` for the partition of curl's 252
# questions. Counted in this file: **108 probes**, 10 literal *choices* (the
# project options that are on), and **10 literal assertions** -- four that
# hold on both platforms and six keyed on one with `[[targets.curl.when]]`.
# Ten assertions against 108 measurements is the honest price of refusing an
# arbitrary-C-snippet probe kind, and keeping them visibly separate from the
# measurements is the whole point of paying it.
#
# TLS, zlib, zstd, brotli, libpsl, libidn2, nghttp2, libssh2 and LDAP are all
# off, matching the cmake options the oracle in `ci/canary/curl-config/` was
# generated with. That is not a limitation of Harbour; it is what keeps this
# canary comparable to a reference answer.

[package]
name = "curl"
version = "8.22.0"
license = "curl"
description = "curl 8.22.0, configured by Harbour probes instead of by configure"

[targets.curl]
kind = "staticlib"
lang = "c"
# curl compiles all 196 of its sources unconditionally and empties the
# disabled ones out with `#ifdef` internally, so there is no per-feature
# source selection to express. The list is `CSOURCES` from
# `lib/Makefile.inc`, verbatim; the only `.c` under `lib/` that is *not* in
