# Public, so the three programs over `core` inherit it. `os`/`arch` below are
# the platform of whoever is building: the target's for the interpreter, the
# host's inside a host tool.
[targets.core.surface.compile.public]
include_dirs = ["Include/internal", "Include/internal/mimalloc", ".", "Include"]
defines = ["Py_BUILD_CORE", "NDEBUG"]
# CPython relies on signed overflow wrapping; the Makefile always passes this.
cflags = ["-fno-strict-overflow"]

# Per-platform answers: the directory holding that platform's `pyconfig.h`.
[[targets.core.surface.when]]
os = "macos"
arch = "aarch64"
[targets.core.surface.when."compile.public"]
include_dirs = ["harbour/pyconfig/macos-aarch64"]

[[targets.core.surface.when]]
os = "linux"
arch = "aarch64"
[targets.core.surface.when."compile.public"]
include_dirs = ["harbour/pyconfig/linux-aarch64"]

[[targets.core.surface.when]]
os = "linux"
arch = "x86_64"
[targets.core.surface.when."compile.public"]
include_dirs = ["harbour/pyconfig/linux-x86_64"]

[[targets.core.surface.when]]
os = "macos"
[targets.core.surface.when."link.public"]
libs = ["dl"]
frameworks = ["CoreFoundation"]

[[targets.core.surface.when]]
os = "linux"
[targets.core.surface.when."link.public"]
libs = ["dl", "m"]

# The perf trampoline, which configure only enables on Linux.
[[targets.core.when]]
os = "linux"
sources = ["Python/asm_trampoline.S"]

# The zlib extension module, built into `core`: `config.c` lists it, so every
# program that links `core` -- the host tools included -- needs it, and with it
# the zlib dependency, which is then built for the host as well.
[[targets.core.when]]
feature = "zlib"
sources = ["Modules/zlibmodule.c"]

# The table of built-in extension modules. The feature set decides which
# modules it lists, so one step produces the right file for every combination
# -- see `HARBOUR_FEATURES`.
#
# Written to `generated/`, not `Modules/config.c` where CPython's own build puts
# it, so that no generated file sits inside a directory a generator below lists
# as an input.
[[targets.core.prebuild]]
program = "sh"
args = ["harbour/config.sh", "atexit", "faulthandler", "posix", "_signal", "_tracemalloc", "_suggestions", "_datetime", "_codecs", "_collections", "errno", "_io", "itertools", "_sre", "_sysconfig", "_thread", "time", "_types", "_typing", "_weakref", "_abc", "_functools", "_locale", "_opcode", "_operator", "_stat", "_symtable", "pwd"]
inputs = ["Modules/config.c.in", "harbour/config.sh"]
env = { CONFIG_OUT = "generated/config.c" }
outputs = ["generated/config.c"]

# --- host programs: they run during the build ---------------------------------

[targets.freeze_module]
kind = "exe"
host = true
lang = "c"
c_std = "11"
sources = ["Programs/_freeze_module.c", "Modules/getpath_noop.c"]
[targets.freeze_module.deps]
core = { local = true }

[targets.bootstrap_python]
kind = "exe"
host = true
lang = "c"
c_std = "11"
sources = ["Programs/_bootstrap_python.c", "Modules/getpath.c"]
[targets.bootstrap_python.deps]
core = { local = true }

# Stage 1: `freeze_module` freezes the four modules `bootstrap_python` and
# `getpath.c` need. Declared on the target that needs them, so they exist before
# its sources are compiled.
[[targets.bootstrap_python.prebuild]]
program = "sh"
args = ["harbour/freeze1.sh"]
tools = ["freeze_module"]
inputs = ["harbour/freeze1.sh", "Modules/getpath.py", "Lib/importlib/_bootstrap.py", "Lib/importlib/_bootstrap_external.py", "Lib/zipimport.py"]
outputs = [
    "Python/frozen_modules/getpath.h",
    "Python/frozen_modules/importlib._bootstrap.h",
    "Python/frozen_modules/importlib._bootstrap_external.h",
    "Python/frozen_modules/zipimport.h",
]

# --- the interpreter ----------------------------------------------------------

[targets.python]
kind = "exe"
lang = "c"
c_std = "11"
sources = ["Programs/python.c", "Modules/getpath.c", "Python/frozen.c"]
[targets.python.deps]
core = { local = true }

# Stage 2: `bootstrap_python` freezes the remaining modules.
[[targets.python.prebuild]]
program = "sh"
args = ["harbour/freeze2.sh"]
tools = ["bootstrap_python"]
inputs = ["harbour/freeze2.sh", "Programs/_freeze_module.py", "Lib/__hello__.py", "Lib/__phello__/__init__.py", "Lib/__phello__/ham/__init__.py", "Lib/__phello__/ham/eggs.py", "Lib/__phello__/spam.py", "Lib/_collections_abc.py", "Lib/_sitebuiltins.py", "Lib/abc.py", "Lib/codecs.py", "Lib/genericpath.py", "Lib/importlib/machinery.py", "Lib/importlib/util.py", "Lib/io.py", "Lib/ntpath.py", "Lib/os.py", "Lib/posixpath.py", "Lib/runpy.py", "Lib/site.py", "Lib/stat.py", "Tools/freeze/flag.py"]
outputs = [
    "Python/frozen_modules/__hello__.h",
    "Python/frozen_modules/__phello__.h",
    "Python/frozen_modules/__phello__.ham.eggs.h",
    "Python/frozen_modules/__phello__.ham.h",
    "Python/frozen_modules/__phello__.spam.h",
    "Python/frozen_modules/_collections_abc.h",
    "Python/frozen_modules/_sitebuiltins.h",
    "Python/frozen_modules/abc.h",
    "Python/frozen_modules/codecs.h",
    "Python/frozen_modules/frozen_only.h",
    "Python/frozen_modules/genericpath.h",
    "Python/frozen_modules/importlib.machinery.h",
    "Python/frozen_modules/importlib.util.h",
    "Python/frozen_modules/io.h",
    "Python/frozen_modules/ntpath.h",
    "Python/frozen_modules/os.h",
    "Python/frozen_modules/posixpath.h",
    "Python/frozen_modules/runpy.h",
    "Python/frozen_modules/site.h",
    "Python/frozen_modules/stat.h",
]
