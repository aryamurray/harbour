# Harbour shim for CPython 3.14.9, copied into the extracted tree by
# `ci/canary/cpython/run.sh`; `overlay/` is laid over the tree beside it.
#
# What this canary is for: the deepest generated-source chain of any package
# here, and the first with an optional dependency whose feature changes a
# *generated* file.
#
#   * The built-in module table (`config.c`) is generated, from `config.c.in` and the active
#     features (`HARBOUR_FEATURES`), the way CPython's `makesetup` does from
#     `Modules/Setup.*`. Enabling `zlib` changes it.
#   * `Python/frozen_modules/*.h` -- 24 headers -- come from a two-stage
#     bootstrap: CPython freezes its own startup modules by running CPython.
#     See `overlay/harbour/bootstrap.sh`.
#   * `inputs` lets that bootstrap be skipped when nothing it reads changed;
#     without it every build re-runs ~190 compiles for the host.
#
# What is NOT generated here, said plainly: `pyconfig.h`. It has 412 answers
# and is what ./configure writes. A vendored copy per platform (produced by
# CPython's own ./configure, with the Makefile-derived values appended) stands
# in for the probe subsystem; probing it is a separate, curl-sized effort. A
# platform with no copy fails at the bootstrap step and names the directory
# it wanted, rather than building with another platform's answers.

[package]
name = "cpython"
version = "3.14.9"
license = "PSF-2.0"

[dependencies]
# `run.sh` points this at a git repository it builds from the zlib canary's
# pinned tarball, so the optional dependency is real and nothing is fetched
# that is not hash-checked.
zlib = { git = "@ZLIB_REPO@", tag = "v1.3.1", optional = true }

[features]
# `run.sh` switches this to ["zlib"] for the second build: `harbour build` has
# no --features of its own, so a root package's features come from here.
default = []

