# Seastar (redpanda-data fork, 5bf36c5), shimmed for Harbour against SYSTEM dependencies.
#
# A spike for docs/superpowers/specs/*-redpanda-feasibility.md: can Harbour compile
# and link the C++23 reactor that Redpanda is built on? Everything Seastar needs
# is taken from the distribution (Boost, fmt, lz4, yaml-cpp, c-ares, OpenSSL,
# hwloc, sctp, liburing, protobuf, abseil) so the question is Harbour's, not the
# packaging of 38 dependencies. Generated inputs are produced beside the sources
# before the build: three ragel parsers and metrics2.pb.{h,cc}.
#
# The source list is the one in redpanda's bazel/thirdparty/seastar.BUILD; the
# defines are its `defines` and `local_defines`.

[package]
name = "seastar"
version = "0.0.0"
license = "Apache-2.0"
requires = "hosted"
supports = ["*-*-linux-gnu"]

[targets.seastar]
kind = "staticlib"
lang = "c++"
cpp_std = "23"
sources = [
  "src/core/alien.cc",
  "src/core/app-template.cc",
  "src/core/condition-variable.cc",
  "src/core/cpu_profiler.cc",
  "src/core/crypto.cc",
  "src/core/crypto_openssl.cc",
  "src/core/disk_params.cc",
  "src/core/dpdk_rte.cc",
  "src/core/exception_hacks.cc",
  "src/core/execution_stage.cc",
  "src/core/fair_queue.cc",
  "src/core/file.cc",
  "src/core/fsnotify.cc",
  "src/core/fsqual.cc",
  "src/core/fstream.cc",
  "src/core/future.cc",
  "src/core/future-util.cc",
  "src/core/io_queue.cc",
  "src/core/linux-aio.cc",
  "src/core/memory.cc",
  "src/core/metrics.cc",
  "src/core/on_internal_error.cc",
  "src/core/posix.cc",
  "src/core/program_options.cc",
  "src/core/prometheus.cc",
  "src/core/reactor.cc",
  "src/core/reactor_backend.cc",
  "src/core/resource.cc",
  "src/core/scollectd.cc",
  "src/core/semaphore.cc",
  "src/core/sharded.cc",
  "src/core/signal.cc",
  "src/core/signal_mutex.cc",
  "src/core/smp.cc",
  "src/core/sstring.cc",
  "src/core/systemwide_memory_barrier.cc",
  "src/core/thread.cc",
  "src/core/thread_pool.cc",
  "src/core/uname.cc",
  "src/http/api_docs.cc",
  "src/http/client.cc",
  "src/http/common.cc",
  "src/http/file_handler.cc",
  "src/http/httpd.cc",
  "src/http/json_path.cc",
  "src/http/matcher.cc",
  "src/http/mime_types.cc",
  "src/http/reply.cc",
  "src/http/request.cc",
  "src/http/retry_strategy.cc",
  "src/http/routes.cc",
  "src/http/transformers.cc",
  "src/http/url.cc",
  "src/json/formatter.cc",
  "src/json/json_elements.cc",
  "src/net/arp.cc",
  "src/net/config.cc",
  "src/net/dhcp.cc",
  "src/net/dns.cc",
  "src/net/dpdk.cc",
  "src/net/ethernet.cc",
  "src/net/inet_address.cc",
  "src/net/ip.cc",
  "src/net/ip_checksum.cc",
  "src/net/native-stack.cc",
  "src/net/net.cc",
  "src/net/packet.cc",
  "src/net/posix-stack.cc",
  "src/net/proxy.cc",
  "src/net/socket_address.cc",
  "src/net/stack.cc",
  "src/net/tcp.cc",
  "src/net/tls-impl.cc",
  "src/net/tls_openssl.cc",
  "src/net/udp.cc",
  "src/net/unix_address.cc",
  "src/net/virtio.cc",
