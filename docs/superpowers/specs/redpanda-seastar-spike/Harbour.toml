[targets.seastar.public]
include_dirs = ["include"]
defines = [
  "SEASTAR_API_LEVEL=10",
  "SEASTAR_SCHEDULING_GROUPS_COUNT=21",
  "SEASTAR_HAS_MEMBARRIER",
  "SEASTAR_HAVE_OPENSSL",
  "SEASTAR_SSTRING",
  "SEASTAR_HAVE_HWLOC",
  "BOOST_TEST_DYN_LINK",
  "BOOST_TEST_NO_LIB",
]
system_libs = [
  "boost_program_options", "boost_filesystem", "boost_thread", "boost_system",
  "fmt", "lz4", "yaml-cpp", "cares", "ssl", "crypto", "hwloc", "sctp", "uring",
  "protobuf", "absl_hash", "absl_city", "absl_low_level_hash", "atomic", "dl", "rt",
]

[targets.seastar.private]
include_dirs = ["include", "src"]
defines = [
  "SEASTAR_DEFERRED_ACTION_REQUIRE_NOEXCEPT",
  "SEASTAR_HAVE_ASAN_FIBER_SUPPORT",
  "SEASTAR_HAVE_URING",
  "SEASTAR_HEAPPROF",
]
cflags = ["-Wno-unused-variable", "-Wno-unused-result", "-Wno-unused-but-set-variable"]
