# TEMPORARY. Validates the new `Canaries (Windows)` job on a Windows runner
# before the real PR exists (ci.yml only runs for PRs and main). Triggered ONLY
# by pushes to these two branches; deleted before the PR is opened. Never merge.
name: Windows canaries probe
on:
  push:
    branches: [windows-canaries, windows-canaries-mutation]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      MSYS: winsymlinks:lnk
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: environment
        run: |
          for t in cl link lib nm dumpbin sha256sum curl tar find; do printf '%-9s %s\n' "$t" "$(command -v $t 2>/dev/null || echo '(not on PATH)')"; done
          echo "date: $(date -u +%T)"
      - name: build harbour
        run: |
          s=$SECONDS; cargo build --locked; echo "cargo build: $((SECONDS - s))s"
      - name: canaries
        run: |
          s=$SECONDS
          CANARIES="cjson zlib" ci/canary/run-all.sh; rc=$?
          echo "canaries: $((SECONDS - s))s (exit $rc)"
          exit $rc
