name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered by base branch. Stacked PRs target the branch
  # below them rather than main, and a `branches: [main]` filter meant those
  # PRs got no checks at all -- the middle of a stack merged unverified.
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # macos-latest: disabled, 10x CI billing
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --locked

  check:
    name: Compilation Check
    # Harbour has substantial #[cfg(windows)] and macOS-only code -- MSVC
    # detection, vcvarsall, dylib naming, rpath rewriting. On a Linux-only
    # runner none of it is even compiled, so a broken call inside a cfg block
    # can sit in main indefinitely. This is the cheapest job, so it carries
    # the full matrix.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # macos-latest: disabled, 10x CI billing
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features --locked

  canary-zlib:
    name: Canary (zlib 1.3.1)
    # Nothing else in CI builds a real third-party library, and that gap is
    # why the archive bug -- `ar r` matching members by name, so a renamed
    # source left its stale object behind to win symbol resolution -- was
    # found by hand instead of by a test. The fixtures in
    # tests/cli_integration.rs are two- and three-file projects; a library
    # with fifteen translation units, a public header its consumers have to
    # find, and platform-conditional defines exercises what they cannot.
    #
    # A separate job on purpose: this one reaches the network, so a failed
    # download shows up as "the canary is red", not as "the tests are
    # broken". The fast suite on every push is untouched.
    #
    # Cost: ubuntu-latest only, billed 1x, ~2 minutes wall clock (most of it
    # `cargo build`, cached; zlib itself compiles in under a second).
    # windows-latest bills at 2x and is deliberately not in the matrix.
    # zlib was chosen for the same reason: no dependencies, 15 sources.
    # openssl (1100+ sources per platform) and curl are explicitly out --
    # they would dominate the bill on a free-tier account.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Debug, not release: the canary is about whether Harbour drives a
      # real build correctly, and `--release` on this crate turns on thin
      # LTO with one codegen unit for no benefit here.
      - run: cargo build --locked
      - run: ci/canary/zlib/run.sh
