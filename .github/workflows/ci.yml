name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered by base branch. Stacked PRs target the branch
  # below them rather than main, and a `branches: [main]` filter meant those
  # PRs got no checks at all -- the middle of a stack merged unverified.
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # macos-latest: disabled, 10x CI billing
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --locked

  check:
    name: Compilation Check
    # Harbour has substantial #[cfg(windows)] and macOS-only code -- MSVC
    # detection, vcvarsall, dylib naming, rpath rewriting. On a Linux-only
    # runner none of it is even compiled, so a broken call inside a cfg block
    # can sit in main indefinitely. This is the cheapest job, so it carries
    # the full matrix.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # macos-latest: disabled, 10x CI billing
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --all-features --locked
