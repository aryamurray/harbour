name: Release

# Pushing a `v*` tag builds the `harbour` binary for each supported host and
# attaches the archives to a *draft* GitHub release. Draft on purpose: nothing
# becomes public until a person has looked at the assets and pressed Publish.
#
# `workflow_dispatch` runs the same builds without creating a release, so the
# matrix can be checked before a tag exists. The archives are then available
# as workflow artifacts only.
#
# Publishing the draft is the third trigger: it renders the Homebrew formula
# from that release's checksums and commits it to the tap. That waits for
# publication because a draft's assets are not downloadable, so a formula
# pushed earlier would point at URLs that 404.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    # Not on `release: published`: the archives were built when the tag was
    # pushed, and are already attached to the release being published.
    if: github.event_name != 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux binaries link the system OpenSSL dynamically (reqwest's
          # `native-tls` backend, see Cargo.toml for why it is not rustls).
          # Building on the oldest hosted Ubuntu keeps the glibc and libssl
          # requirement as low as the runners allow: glibc 2.35, libssl.so.3.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled from the arm64 runner. TLS on macOS is the system
          # Security framework, so there is no foreign-architecture OpenSSL
          # to find.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # A tag that disagrees with Cargo.toml would publish archives whose
      # `harbour --version` contradicts their own file name.
      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          name="harbour-$version-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/harbour.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "asset=$name.zip" >> "$GITHUB_OUTPUT"
          else
            cp "target/${{ matrix.target }}/release/harbour" "$name/"
            tar -czf "$name.tar.gz" "$name"
            echo "asset=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      # The archive must contain a binary that starts on the machine that
      # built it. The x86_64 macOS build is cross-compiled, so it is the one
      # target that cannot be run here.
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          "harbour-$version-${{ matrix.target }}/harbour" --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum harbour-* > SHA256SUMS

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --draft

  # `brew install aryamurray/harbour/harbour` reads the formula from the tap
  # repository `aryamurray/homebrew-harbour`. This job writes it there.
  #
  # It needs a `HOMEBREW_TAP_TOKEN` secret: a token that can push to the tap,
  # since this workflow's own token only reaches this repository. Without the
  # secret the job still renders the formula and uploads it as an artifact, so
  # it can be committed to the tap by hand.
  homebrew:
    name: Homebrew formula
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Render the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          packaging/homebrew/render-formula.sh "$TAG" SHA256SUMS > harbour.rb
          ruby -c harbour.rb

      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: harbour.rb
          if-no-files-found: error

      - name: Commit it to the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the formula was uploaded as an artifact and the tap was not updated"
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:$TAP_TOKEN@github.com/aryamurray/homebrew-harbour.git" tap
          mkdir -p tap/Formula
          cp harbour.rb tap/Formula/harbour.rb
          cd tap
          git add Formula/harbour.rb
          if git diff --cached --quiet; then
            echo "the tap already has this formula"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "harbour ${TAG#v}"
          git push
